## What is a Binary Tree?

- Special tree where each node has 0, or 1 or at most 2 children
- Children designated as left and right
- More structured than general trees

![img_1.png](assets/img_1.png)


---

## Types of Binary Trees


1. Complete Binary Tree
   - All levels filled except last
   - Last level filled left to right
   ```
         A
        / \
       B   C
      / \
      D E
   
   ```
2. Full Binary Tree
    - Each node has 0 or 2 children
   ```
         A
        / \
       B   C
      / \
     D   E
   ```

3. Perfect Binary Tree
   - All levels completely filled
   ```
       A
     /   \
    B     C
   / \   / \
   D  E F   G

   ```
4. Balanced Binary Tree
   - Height of left and right subtrees differ by at most one
   
   ```
         A
        / \
       B   C
      / \  / \
     D  E F   G
    /
   H
   ```

---

## Binary Tree Representation

1. Array representation:
   - For a node at index i:
      - Left child: 2i + 1
      - Right child: 2i + 2
      - Parent: (i - 1) / 2 (integer division)

2. Linked representation:

```java
class Node {
    int data;
    Node left;
    Node right;

    public Node(int data) {
        this.data = data;
        left = right = null;
    }
}
```

---

## Binary Tree Operations
1. Insertion: Add new node
2. Deletion: Remove node
3. Traversal: Visit all nodes
4. Search: Find specific node

## Binary Search Trees (BST), What Makes a BST Special?

Every node follows the BST rule:
- All nodes in the left subtree have values less than the node's value
- All nodes in the right subtree have values greater than the node's value

```
Regular Binary Tree (Valid)java 
     5                         
    / \                        
   8   3                        
  /                             
 9                               

                          BST (Valid)  
                              5        
                            /   \      
                           3     8     
                          / \   / \    
                         1   4 6   9   
                                              Not a BST (Invalid)     
                                                  5                   
                                                /   \                 
                                              3     4                 
                                             /     /                  
                                            1     8                   
```

##  BST Operations Performance

| Operation  | Binary Tree | BST (Average) | BST (Worst) |
|------------|-------------|---------------|-------------|
| Search     | O(n)        | O(log n)      | O(n)        |
| Insert     | O(1)*       | O(log n)      | O(n)        |
| Delete     | O(n)        | O(log n)      | O(n)        |

---

## Why BST is Better
1. Efficient Searching O(log n)
- Binary decision at each node (left or right)
- Eliminates half of remaining nodes each step
```java
// Example: Finding 45 in BST
//       50
//      /  \
//     30   70    Only need to check: 50 → 30 → 45
//    /  \
//   20   45

```

---
## Why BST is Better
2. Maintains Sorted Order

- Inorder traversal gives sorted elements
- Perfect for range-based operations
```java
  void printSorted(Node root) {  // Inorder traversal
  if (root != null) {
      printSorted(root.left);
      System.out.print(root.value + " ");
      printSorted(root.right);
    }
  }
  // Output: Always in sorted order
```


---
## Why BST is Better
3. Efficient Updates

- No need to shift elements (unlike arrays)
- Insertion and deletion maintain order automatically
```java
// Array: Need to shift elements
// [10,20,30,40] → insert(25) → [10,20,25,30,40]

// BST: Just link nodes
//    20          20
//   /  \   →    /  \
//  10  30     10   30
//                  /
//                25

```
---

## Why BST is Better
4. Natural for Range Operations
```java
// Find all numbers between 20 and 50
void printRange(Node root, int min, int max) {
    if (root == null) return;
    
    if (root.value >= min)
        printRange(root.left, min, max);
        
    if (root.value >= min && root.value <= max)
        System.out.print(root.value + " ");
        
    if (root.value <= max)
        printRange(root.right, min, max);
}


```

---
## Common BST Problems & Solutions

Problem: BST Can Become Unbalanced, causing performance issues 
- When data is inserted in sorted order, BST becomes like a linked list
- Operations become O(n) instead of O(log n)

```java
// Example: Inserting sorted numbers
BST tree = new BST();
tree.insert(10);
tree.insert(20);
tree.insert(30);
tree.insert(40);
//
// Results in:
//   10
//     \
//      20
//        \
//         30
//           \
//           40

// Now searching for 40 requires checking every node!

// Good BST (Balanced)          
//                                  
//       20                         
//      /  \                        
//     10   30                      
//    /  \    \                     
//   5   15    40                   
//                                  
//                                  
// Searching for 40:
// Balanced: 3 steps (20→30→40)   
// Unbalanced: 4 steps (10→20→30→40)
```
Solution: Self-balancing BSTs

* <em>AVL Trees</em>, 
* Red-Black Trees
* Keep tree balanced automatically
* Guarantee O(log n) operations

```java
// Example: After inserting 30,40,50
// Before balancing:  
//      30           
//        \           
//         40         
//           \
//           50
//  After balancing:
//       40         
//     /   \        
//   30     50      
                 

```
