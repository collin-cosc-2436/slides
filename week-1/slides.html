### What is Object-Oriented Programming (OOP)?
<span class="fragment">

- A paradigm that organizes your code around data or "objects", rather than functions and logic.  

- Objects have attributes (fields) and behaviors (methods) that interact with each other.

- Key Principles of OOP: 
    - *Encapsulation*: Bundling the data (fields) and methods (functions) that operate on the data into a single unit or
      class.
  
    - *Inheritance*: Mechanism where one class inherits fields and methods from another, promoting code reuse.
  
    - *Polymorphism*: Ability of objects of different classes to be treated as objects of a common type. 
  
    - *Abstraction*: Hiding the complex implementation details and exposing only the essential features of the object.
</span>
---

### Why is OOP Important?

- *Real-World Modeling*: OOP allows you to model real-world entities in code, making software more intuitive and easier
  to maintain.

- *Modularity*: Code is easier to manage and reuse when it’s broken down into modular classes.

- *Maintainability*: OOP principles make it easier to manage and modify existing code without affecting other parts of
  the system.

---

### Java as an OOP Language

Java is inherently object-oriented, making it ideal for modeling real-world entities.

- **Core Java Concepts**:
    - *Classes*: The blueprint for creating objects that define the properties and behavior of objects.
    - *Objects*: Instances of classes that hold data and behavior.
    - *Methods*: A function defined within a class that describes the behaviors of the objects.
    - *Fields*: Variables within a class that hold data specific to an object.
- Example:

  ```java 
  public class Dog {
      String name;
      int age;
      void bark() {
        System.out.println(name + " is barking");
    }
  }
  ```

### Object-Oriented Design(OOD): Finding the Classes and Their Responsibilities

When designing software, it’s important to identify the classes needed and what responsibilities each class should have.  

*Case Study*: Imagine you're designing a software system for a restaurant. Here’s how you might think about classes and responsibilities:

**Classes**:
- *Chef*: Responsible for cooking food.
- *Waiter*: Responsible for taking orders from customers and serving food.
- *Customer*: Represents the person dining at the restaurant.

**Responsibilities**:
- *Chef*: Cooks dishes based on orders received.
- *Waiter*: Takes orders, delivers them to the kitchen, and serves the prepared dishes.
- *Customer*: Places orders and consumes the food.

In this example, the Chef doesn’t worry about taking orders or serving food—that's not their responsibility. The Waiter doesn’t cook the food, but they are responsible for ensuring the customer’s orders are properly communicated and delivered. The Customer simply interacts with the system by placing an order and expecting service.

---

### **Steps to Identify Classes and Responsibilities**

#### *Understanding the Problem Domain*

Before designing any system, it’s essential to have a deep understanding of the problem domain—the real-world environment where the software will be used. The problem domain provides context and helps ensure that the software addresses the right issues. A thorough grasp of the problem domain allows you to create software that models real-world situations accurately, leading to better functionality and maintainability.
  - **Restaurant Example:**
    - **Business Processes:** How orders are taken, food prepared, tables managed, payments processed.
    - **Key Actors:** Waiters, chefs, cashiers, customers.
    - **Resources:** Menu items, tables, ingredients, inventory.

---

#### Identify Nouns and Verbs
- **Nouns:** Often represent potential *classes* (e.g., "Customer," "Order," "Menu," "Table," "Chef," "Waiter").
- **Verbs:** Suggest potential *methods* or *responsibilities* (e.g., "takeOrder," "prepareFood," "serveFood," "calculateBill"). 
---

--- 

#### Assign Responsibilities to Classes
Determine what each class *knows* (data/attributes) and what it *does* (methods/behaviors).
- `Customer`: Name, contact, order history. Can place an order, view order status.
- `Order`: List of menu items, order status, total cost. Can add/remove items, calculate total.
- `MenuItem`: Name, description, price.

--- 

#### Identify Relationships Between Classes
How do classes interact? (e.g., "Order" has many "MenuItems," "Waiter" takes orders from "Customer")
  - Consider relationships like:
    - **Association:** A general relationship between two classes (e.g., "Customer" places an "Order").
    - **Aggregation:** A weaker form of composition where one class *has* another (e.g., "Order" has "MenuItems").
    - **Composition:** A stronger form where one class *owns* another (e.g., "Car" has an "Engine").
    - **Inheritance:** A class inherits properties and behaviors from another class (e.g., "Pizza" inherits from "MenuItem").  
    


---
### SOLID Principles in Object-Oriented Design

*S: Single Responsibility Principle*: A class should have only one reason to change, meaning it should have only one job or responsibility.

*O: Open/Closed Principle*:Software entities (classes, modules, functions) should be open for extension but closed for modification.

*L: Liskov Substitution Principle*: Objects of a superclass should be replaceable with objects of its subclasses without breaking the application.

*I: Interface Segregation Principle*: Clients should not be forced to depend on interfaces they do not use.

*D: Dependency Inversion Principle*: High-level modules should not depend on low-level modules. Both should depend on abstractions.

# Introduction to Data Structures and Algorithms

---

#### **What is a Data Structure?**
- A **data structure** is a specific framework or layout for storing and managing data, enabling efficient operations like retrieval, insertion, or deletion. 
- It is the "end result" of how data is organized or structured.  
- *Data Structure* (How you organize the books)
- **Examples:**
  - An **array** is like a straight row of boxes where each box holds a value, and every box has a specific position.
  - A **stack** is like a stack of plates: you can only add or remove the top plate.
--- 
#### **What is an Algorithm?**
- An **algorithm (Steps or Process)** is a step-by-step procedure for solving a problem, which may involve organizing, searching, or transforming data within a data structure.
- *Algorithm* (How you interact with the books)
- **Examples:**
  - Sorting an array into ascending order is an algorithm (e.g., Bubble Sort, Merge Sort).
  - Searching for a specific value in a stack is an algorithm (e.g., Linear Search).

---

*Data structure and algorithm work together*
1. The **data structure** determines the **efficiency** of your actions.
   - Searching a book on an unsorted shelf is slower than on a sorted shelf.
2. The **algorithm** is the procedure that interacts with the structure.
   - You’d use different steps (algorithms) to find a book depending on how the shelf is organized.  

*Data structures are tools for storing data, and algorithms are methods for working with that data efficiently*

---

### Why is this Important?

1. **Efficient Problem Solving**: DSA provides tools and techniques to solve problems efficiently in terms of time and space.

2. **Foundation of Computer Science**: It forms the backbone of software development, enabling logical thinking and problem decomposition.

3. **Optimized Resource Utilization**: Helps build systems that use memory, CPU, and storage effectively, critical for high-performance applications.

4. **Scalability**: DSA ensures that programs remain efficient as the size of the input data grows, which is crucial for real-world applications like search engines, databases, and social media platforms.

5. **Real-World Applications**: Many technologies rely on DSA, such as route optimization (shortest path algorithms), recommendation systems (graph algorithms), and data compression (Huffman coding).

6. **Improves Coding Skills and Interviews**: Helps developers write cleaner, modular, and reusable code and Essential for cracking technical job interviews at top companies.
