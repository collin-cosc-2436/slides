## Introduction to Trees

- Hierarchical data structure
- Nodes connected by edges
- One root node
- No cycles allowed
- Each node can have multiple children

## Why Trees?

- Natural hierarchical representation
- Efficient searching and sorting
- File systems
- Organization charts
- Family trees
- XML/HTML DOM
- AI Decision Trees

## What is a Binary Tree?

- Special tree where each node has 0, or 1 or at most 2 children
- Children designated as left and right
- More structured than general trees

![img_1.png](assets/img_1.png)

---

## Types of Binary Trees


1. Complete Binary Tree
   - All levels filled except last
   - Last level filled left to right
   ```
         A          
        / \
       B   C
      / \
     D   E
   
   ```
2. Full Binary Tree
    - Each node has 0 or 2 children
   ```
         A
        / \
       B   C
      / \
     D   E
   ```

3. Perfect Binary Tree
   - All levels completely filled
   ```
       A
     /   \
    B     C
   / \   / \
   D  E F   G

   ```
4. Balanced Binary Tree
   - Height of left and right subtrees differ by at most one
   
   ```
         A
        / \
       B   C
      / \  / \
     D  E F   G
         /
        H
   ```

---

## Binary Tree Representation

1. Array representation:
   - For a node at index i:
      - Left child: 2i + 1
      - Right child: 2i + 2
      - Parent: (i - 1) / 2 (integer division)

2. Linked representation:

```java
class Node {
    int data;
    Node left;
    Node right;

    public Node(int data) {
        this.data = data;
        left = right = null;
    }
}
```
~.~

---

## Binary Tree Operations
1. Insertion: Add new node
2. Deletion: Remove node
3. Traversal: Visit all nodes
4. Search: Find specific node

## Binary Tree Traversals

- **Preorder Traversal**: Root, Left, Right
- **Inorder Traversal**: Left, Root, Right
- **Postorder Traversal**: Left, Right, Root
- **Level Order Traversal**: Level by level from top to bottom

```java
// Recursive Inorder traversal
void inOrder(Node node) {
    if (node == null) return;
    inOrder(node.left);      // Traverse left
    System.out.print(node.value + " "); // Process node
    inOrder(node.right);     // Traverse right
}
```

## Introduction to Heap Data Structure

- A binary tree with two special properties:
    1. **Structure Property**: Complete binary tree
    2. **Heap Property**:
        - **Max Heap**: Parent key ≥ children keys
        - **Min Heap**: Parent key ≤ children keys

![heap_example](assets/heap.png)

---

## Max Heap vs Min Heap

| Max Heap | Min Heap |
|----------|----------|
| Root contains maximum value | Root contains minimum value |
| For any node N, value(parent(N)) ≥ value(N) | For any node N, value(parent(N)) ≤ value(N) |

---

## Heap Representation

- Typically implemented as an array
- For node at index i:
    - Parent: (i-1)/2
    - Left child: 2*i+1
    - Right child: 2*i+2

---

## Heaps: Key Operations (Conceptual)

1. **Insert**: Add new element and restore heap property
2. **Extract**: Remove root element and restore heap property
3. **Heapify**: Convert an array into a valid heap

*Detailed implementation will be covered next week*

---

## Introduction to Priority Queues

- Abstract data type similar to queues
- Each element has a "priority"
- Higher priority elements are served before lower priority elements
- Operations: insert, delete, peek, isEmpty

---

## Heaps for Priority Queues

- Natural implementation for priority queues
- Efficient operations:
    - Insert: O(log n)
    - Extract maximum/minimum: O(log n)
    - Peek maximum/minimum: O(1)

| Priority Queue Operation | Corresponding Heap Operation |
|--------------------------|------------------------------|
| Insert with priority | Insert into heap |
| Get highest priority item | Peek at root |
| Remove highest priority item | Extract root |

---

## Applications of Heaps and Priority Queues

- Dijkstra's shortest path algorithm
- Prim's minimum spanning tree algorithm
- Huffman coding (data compression)
- Task scheduling in operating systems
- Event-driven simulation
- Media streaming
